<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyrex Emmanuel · Research Consultant</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1b1a2e;--mute:#5e5c78;--line:#e3e0f5;--p:#5b3df5;--t:#0fb5ae;--o:#ff8a3d;--pk:#ec4899;--g:#22b573;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111f;--card:#1c1a30;--ink:#f1f0ff;--mute:#a9a6c8;--line:#2e2b4a}}
:root[data-theme="dark"]{--bg:#12111f;--card:#1c1a30;--ink:#f1f0ff;--mute:#a9a6c8;--line:#2e2b4a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 70px}
.hero{background:linear-gradient(135deg,#5b3df5 0%,#0fb5ae 60%,#ff8a3d 120%);color:#fff;padding:54px 18px 70px;border-radius:0 0 34px 34px}
.hero .in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:28px}.hero .txt{flex:1 1 340px}.photo{width:min(280px,72vw);aspect-ratio:4/5;object-fit:cover;border-radius:26px;border:4px solid rgba(255,255,255,.75);box-shadow:0 16px 40px rgba(0,0,0,.3);margin:0 auto}
.badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:99px;font-size:14px;margin-bottom:14px}
h1{font-size:clamp(30px,7vw,54px);line-height:1.1;margin:0 0 8px}
.role{font-size:19px;font-weight:600;opacity:.95;margin:0 0 14px}
.bio{font-size:18px;max-width:640px;margin:0 0 22px;opacity:.96}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;cursor:pointer;display:inline-block;padding:11px 18px;border-radius:10px;background:#fff;color:#3b27c4;text-decoration:none;font:700 15px system-ui,sans-serif}
.btn.alt{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.btn.sol{background:var(--p);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:-38px}
.stat{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(91,61,245,.15);border-bottom:4px solid var(--c)}
.stat b{display:block;font-size:30px;color:var(--c)}.stat span{font-size:14px;color:var(--mute)}
section{padding:36px 0 0}
h2{font-size:26px;margin:0 0 16px}
h2::after{content:"";display:block;width:54px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--p),var(--o));margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mute);font-size:15px}
.card a{color:var(--p);font-weight:600;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.tags li{background:var(--c);color:#fff;border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600}
.conf{border-left:5px solid var(--c);background:var(--card);border-radius:10px;padding:11px 14px;font-weight:600}
.tl .item{position:relative;padding:0 0 18px 22px;border-left:3px solid var(--line)}
.tl .item::before{content:"";position:absolute;left:-9px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--c)}
.tl h3{margin:0;font-size:17px}.tl .m{color:var(--mute);font-size:14px;margin:0 0 4px}.tl p{margin:0}
blockquote{margin:0;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pk);border-radius:12px;padding:16px;font-style:italic}
blockquote cite{display:block;margin-top:8px;font-style:normal;font-weight:700;color:var(--mute);font-size:14px}
.empty{color:var(--mute);font-style:italic}
form.req{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px}
footer{margin-top:40px;text-align:center;color:var(--mute);font-size:14px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:none}
#ed{position:fixed;inset:0;z-index:30;background:rgba(10,8,30,.55);display:none;padding-top:env(safe-area-inset-top,0px)}
#ed .panel{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--bg);overflow:auto;padding:18px 18px calc(90px + env(safe-area-inset-bottom,0px))}
#ed h4{margin:18px 0 6px;color:var(--p)}
#ed label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.row{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;margin:6px 0;display:grid;gap:6px}
.sm{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:600 13px system-ui}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0;background:var(--bg)}
#msg{font-size:13px;color:var(--mute);align-self:center}
</style>
</head>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const COL=['var(--p)','var(--t)','var(--o)','var(--pk)','var(--g)'];
const $=s=>document.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);for(const k in a||{}){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x&&x.nodeType?x:document.createTextNode(x==null?'':x)));return e}
const col=i=>'--c:'+COL[i%COL.length];
function sec(title,body){return h('section',{id:title},h('h2',null,title),body)}
function render(){
 const app=$('#app');app.innerHTML='';
 const wa=D.phone?'https://wa.me/'+D.phone.replace(/\D/g,''):'';
 app.append(h('div',{class:'hero'},h('div',{class:'in'},h('div',{class:'txt'},
  h('span',{class:'badge'},D.badge),h('h1',null,D.name),h('p',{class:'role'},D.role),h('p',{class:'bio'},D.bio),
  h('div',{class:'btns'},
   h('a',{class:'btn',href:'#Request support'},'Request support'),
   D.email&&h('a',{class:'btn alt',href:'mailto:'+D.email},'Email'),
   wa&&h('a',{class:'btn alt',href:wa},'WhatsApp'),
   D.linkedin&&h('a',{class:'btn alt',href:D.linkedin},'LinkedIn'),
   h('button',{class:'btn alt',onclick:share},'Share this page'))),D.photo&&h('img',{class:'photo',src:D.photo,alt:D.name}))));
 const w=h('div',{class:'wrap'});app.append(w);
 w.append(h('div',{class:'stats'},D.stats.map((s,i)=>h('div',{class:'stat',style:col(i)},h('b',null,s.t),h('span',null,s.d)))));
 w.append(sec('What I do',h('div',{class:'grid'},D.services.map((s,i)=>h('div',{class:'card',style:col(i)},h('h3',null,s.t),h('p',null,s.d))))));
 w.append(sec('Research areas',h('ul',{class:'tags'},D.areas.map((a,i)=>h('li',{style:col(i)},a)))));
 w.append(sec('Publications',h('div',{class:'grid'},D.pubs.map((p,i)=>h('div',{class:'card',style:col(i+1)},h('h3',null,p.t),h('p',null,p.j),p.u&&h('a',{href:p.u},'Read the paper →'))))));
 w.append(sec('Conferences',h('div',{class:'grid'},D.confs.map((c,i)=>h('div',{class:'conf',style:col(i+2)},c)))));
 w.append(sec('Experience',h('div',{class:'tl'},D.exp.map((e,i)=>h('div',{class:'item',style:col(i)},h('h3',null,e.t),h('p',{class:'m'},e.m),h('p',null,e.d))))));
 w.append(sec('Client voices',D.tests.length?h('div',{class:'grid'},D.tests.map(t=>h('blockquote',null,'“'+t.q+'”',h('cite',null,t.by)))):h('p',{class:'empty'},'Testimonials will appear here.')));
 const f=h('form',{class:'req',onsubmit:ev=>{ev.preventDefault();const v=n=>f.elements[n].value;
  const txt='Hello '+D.name.split(' ')[0]+', I am '+v('n')+'. I need help with: '+v('k')+'. '+v('m');
  location.href=wa?wa+'?text='+encodeURIComponent(txt):'mailto:'+D.email+'?subject='+encodeURIComponent(v('k'))+'&body='+encodeURIComponent(txt)}},
  h('input',{name:'n',placeholder:'Your name',required:''}),
  h('select',{name:'k'},['Research design','Data analysis','Publication support','Conference presentation','Market or policy research','Training','Something else'].map(o=>h('option',null,o))),
  h('textarea',{name:'m',placeholder:'Tell me about your study, deadline and location'}),
  h('button',{class:'btn sol',type:'submit'},'Send via '+(wa?'WhatsApp':'email')));
 w.append(sec('Request support',f));
 w.append(h('footer',null,'© 2026 '+D.name));
}
async function share(){try{if(navigator.share)await navigator.share({title:D.name,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Link copied')}}catch(e){}}
